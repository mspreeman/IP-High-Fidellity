.tracker-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tracker{border:1px solid #dee4ed;border-radius:10px;padding:14px;background:#f9fafc;display:flex;flex-direction:column;gap:5px}
.tracker label{font-size:12px;font-weight:650;color:#57677a}.tracker strong{font-size:16px;color:#172c47}.tracker small{color:#506078}
.snapshot{background:#fff;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:17px}
.note-box{color:#263850}.note-box strong{color:#1b3049}
.responsive-table{width:100%;overflow-x:auto}
.data-table{border-collapse:collapse;width:100%;min-width:840px;text-align:left}
.data-table th{background:#f5f7fa;color:#43556a;font-weight:750;font-size:12px}
.data-table td,.data-table th{border-bottom:1px solid #e5e9ef;padding:12px 10px;vertical-align:top}
.data-table td>small{display:block;color:#536278;margin-top:3px}
.data-table tr:last-child td{border-bottom:0}
.coverage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e8ebef;padding:11px 0}
.coverage-row:last-of-type{border-bottom:0}
.coverage-row>span:first-child{font-weight:650;font-size:12px;color:#25374d}
.coverage-row .pill{white-space:normal;text-align:right;line-height:1.3}
.rep-card{display:grid;gap:8px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;color:#172c47}
.rep-card:hover{background:#faf8f2;border-color:#c9ac76}
.rep-card.active{border:2px solid var(--gold);padding:15px;background:#fcfaf5}
.rep-card strong{font-size:15px}.rep-card span{font-size:12px;color:#55647a}
.report-panel{margin-top:18px;border:1px solid var(--line);border-radius:11px;background:#fafbfd;padding:18px}
.report-panel h3{font-size:17px;color:#172c47}
.company-name,.contact-company-name,.big-company{color:#172c47!important;font-weight:800!important}
.directory-grid .directory-list .directory-entry .entry-head strong{color:#172c47!important}
.top-status{letter-spacing:.2px}
@media(max-width:1040px){.mini-stats{gap:8px}.two-col-cta>.btn{width:100%}}
@media(max-width:700px){.tracker-grid{grid-template-columns:1fr}.mini-stats>div{padding:10px}.mini-stats strong{font-size:19px}.mini-stats span{font-size:10px}.inline-actions>.btn{flex:1}.rep-card{padding:12px}.data-table{min-width:740px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

inked.')}</div><div class="profile-section"><div class="section-title"><h2>${icon('clipboard')} Commitments and decisions</h2></div>${prom.length?prom.map(q=>`<div class="item-row"><div class="row-main"><strong>${esc(q.title)}</strong><p>${esc(q.source)}</p><div class="row-meta">${promisePill(q)}</div></div><button class="row-arrow" data-open-promise="${q.id}">${icon('arrow')}</button></div>`).join(''):itemEmpty('No open promises associated with this project.')}</div><div class="profile-section"><div class="section-title"><h2>${icon('clock')} Source-based activity</h2></div>${int.map(x=>`<div class="item-row"><div class="row-icon">${icon('file')}</div><div class="row-main"><strong>${esc(x.title)}</strong><p>${esc(x.summary)}</p><p>${dateNice(x.date)} · Source: ${esc(x.source)}</p></div></div>`).join('')||itemEmpty('No logged project activity.')}</div>`:''}</div></div>`}
function renderPromises(){let all=state.promises.filter(p=>ui.promiseFilter==='All'||p.status===ui.promiseFilter||(ui.promiseFilter==='Overdue'&&p.status==='Open'&&dayDiff(p.due)<0)||(ui.promiseFilter==='Made by me'&&p.status==='Open'&&p.direction==='Made by me')||(ui.promiseFilter==='Made to me'&&p.status==='Open'&&p.direction==='Made to me')).sort((a,b)=>a.due.localeCompare(b.due));return `${head('Commitment intelligence','Open Promises','Automatically captured commitments, with visible sources, owners and due dates.',button(icon('plus')+' Add promise','add-promise','gold'))}<div class="toolbar"><div class="tabs">${['Open','Overdue','Made by me','Made to me','Completed','Dismissed','All'].map(t=>`<button class="tab ${ui.promiseFilter===t?'active':''}" data-promise-filter="${t}">${t}</button>`).join('')}</div><span class="small muted">Auto-created promises can always be edited, completed or dismissed.</span></div><div class="grid g2">${all.map(p=>`<div class="card pad"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="company-name">${esc(company(p.companyId)?.name||'No company')}</span>${promisePill(p)}</div><h2 style="margin:12px 0 6px;font-size:17px">${esc(p.title)}</h2><p class="small muted">${esc(contact(p.contactId)?.name||'Unknown person')} · ${esc(p.direction)} · Responsible: ${esc(p.owner)}</p><div class="note-box" style="margin-top:13px;background:#f9fafb;border-color:var(--line)"><strong class="small">Original source</strong><p style="margin-top:4px">${esc(p.source)}</p><p style="margin-top:6px;font-style:italic">“${esc(p.origin)}”</p></div><div class="btn-row" style="margin-top:13px">${button(icon('edit')+' Review / Edit','edit-promise-'+p.id,'sm')}${p.status==='Open'?button(icon('check')+' Complete','complete-promise-'+p.id,'sm primary')+button('Dismiss','dismiss-promise-'+p.id,'sm danger'):''}</div></div>`).join('')||`<div class="card" style="grid-column:1/-1">${itemEmpty('No promises in this category.')}</div>`}</div>`}
function renderFollowups(){let contacts=[...state.contacts].filter(c=>c.cadence).sort((a,b)=>nextFollow(a).localeCompare(nextFollow(b)));return `${head('Relationship maintenance','Follow-ups','Schedule meaningful touchpoints without manually creating every reminder.',button(icon('plus')+' Log touchpoint','log-touchpoint','gold'))}<div class="grid g3" style="margin-bottom:19px">${[['Overdue',contacts.filter(c=>dayDiff(nextFollow(c))<0).length,'alert'],['Due this week',contacts.filter(c=>dayDiff(nextFollow(c))>=0&&dayDiff(nextFollow(c))<=7).length,'calendar'],['Scheduled relationships',contacts.length,'users']].map(([n,v,i])=>`<div class="card summary-stat"><div class="stat-icon">${icon(i)}</div><strong>${v}</strong><span>${n}</span></div>`).join('')}</div><div class="card pad">${section(`${icon('calendar')} Your follow-up queue`)}${contacts.map(c=>`<div class="item-row"><div class="row-icon">${icon('users')}</div><div class="row-main"><strong>${esc(c.name)}</strong><p><b class="company-name">${esc(company(c.companyId)?.name||'')}</b> · Every ${c.cadence} days</p><div class="row-meta"><span class="pill ${dayDiff(nextFollow(c))<0?'danger':dayDiff(nextFollow(c))<=7?'gold':'neutral'}">${dueText(nextFollow(c))}</span>${detailed(c)?'<span class="pill blue">Detailed</span>':''}</div></div><div class="btn-row">${button('Log contact','log-'+c.id,'sm')}${button('View','view-'+c.id,'sm')}</div></div>`).join('')}</div>`}
function renderSuggestions(){return `${head('Contact discovery','Suggested Contacts','LuMaCo can suggest frequent business contacts, but never enrolls or tracks them without approval.',button(icon('plus')+' Add contact manually','add-contact','gold'))}<div class="notice" style="margin-bottom:19px">${icon('shield')} <strong>Privacy rule:</strong> Personal or unknown senders are not converted into tracked contacts. Suggestions are optional and should use limited metadata; people become tracked only after you explicitly add them.</div>${!state.settings.suggestions?`<div class="card pad">Suggested Contacts are disabled in Settings. ${button('Open settings','go-settings','sm')}</div>`:`<div class="grid g2">${state.suggestions.map(s=>`<div class="card pad"><div class="entry-head"><span class="avatar">${initials(s.name)}</span><div><h2 style="font-size:17px">${esc(s.name)}</h2><div class="small muted">${esc(s.title)}</div></div></div><div class="company-name" style="margin:13px 0 9px">${esc(s.company)}</div><p class="small muted">${esc(s.email)}</p><div class="note-box" style="margin:13px 0"><p><strong>Why suggested?</strong> ${esc(s.reason)}</p><p style="margin-top:5px">Not tracked · Awaiting your approval</p></div><div class="btn-row">${button(icon('plus')+' Review & add','approve-suggest-'+s.id,'sm primary')}${button('Dismiss','dismiss-suggest-'+s.id,'sm')}</div></div>`).join('')||`<div class="card" style="grid-column:1/-1">${itemEmpty('No suggestions awaiting review.')}</div>`}</div>`}`}
function renderIntegrations(){const integrations=[['Microsoft Outlook','mail','Email changes, thread context and link-backs'],['Gmail','mail','Email conversation categorization and summaries'],['Microsoft / Google Calendar','calendar','Scheduled meetings and completed meeting prompts'],['Phone calls','phone','Call-ended triggers and call metadata; requires platform-specific support'],['SMS / messaging','message','Message metadata where device/platform permissions allow'],['Project tools / CRM','briefcase','Optional sourced project data without replacing existing systems']];return `${head('Read-only first','Integrations','Connect the tools professionals already use. In this prototype, every integration is simulated.')}<div class="notice" style="margin-bottom:19px"><strong>Current status: no live account access.</strong> These are capability previews, not authenticated connections. Browser-based apps cannot scrape arbitrary device SMS, call logs, or iMessage. Production access depends on provider APIs, operating-system permissions, consent, and employer policies.</div><div class="grid g3">${integrations.map(([name,i,descr])=>`<div class="integration">${icon(i,'lg')}<strong>${name}</strong><p>${descr}</p><div class="pill-line" style="margin:15px 0"><span class="pill neutral">Not connected</span><span class="pill gold">Simulation available</span></div>${button('Preview workflow','preview-integration-'+name.replaceAll(' ','_'),'sm')}</div>`).join('')}</div><div class="card pad gap-section"><h2 style="margin-bottom:12px">How information reaches LuMaCo</h2><div class="grid g3"><div class="note-box"><strong>1. Authorized read access</strong><p style="margin-top:7px">Account owner grants narrowly scoped access. Data is pulled through approved APIs or supported device integrations.</p></div><div class="note-box"><strong>2. Match approved contacts</strong><p style="margin-top:7px">Emails sorted for everyone. Only approved contacts receive relationship histories and promises.</p></div><div class="note-box"><strong>3. Review and surface actions</strong><p style="margin-top:7px">Create Open Promises automatically; ask for review on detailed notes, mismatches, conflicts, and uncertain data.</p></div></div><p class="muted small" style="margin-top:16px">Personal storage in a real product would require authenticated accounts, encryption, retention rules, and an independent backend. Local demo browser storage does not provide these safeguards.</p></div>`}
function renderSettings(){return `${head('Workspace preferences','Settings','Control privacy, automation visibility and your local demo data.')}<div class="card pad"><h2 style="margin-bottom:5px">Privacy & automation</h2><div class="settings-row"><div><strong>Suggested Contacts</strong><p>Offer frequent business contacts for approval without automatically tracking them.</p></div><button class="switch ${state.settings.suggestions?'on':''}" data-toggle-setting="suggestions" role="switch" aria-checked="${state.settings.suggestions}" aria-label="Suggested contacts"></button></div><div class="settings-row"><div><strong>Automatic Open Promise detection</strong><p>When an approved contact makes a clear commitment, add it automatically. Every promise keeps its source and can be edited or dismissed.</p></div><button class="switch ${state.settings.autoPromises?'on':''}" data-toggle-setting="autoPromises" role="switch" aria-checked="${state.settings.autoPromises}" aria-label="Automatic promises"></button></div><div class="settings-row"><div><strong>Work / Focus Mode</strong><p>Pause in-app reminders visually. This standalone webpage cannot silence Outlook, phone calls, or system notifications.</p></div><button class="switch ${state.settings.focus?'on':''}" data-toggle-setting="focus" role="switch" aria-checked="${state.settings.focus}" aria-label="Focus mode"></button></div><div class="settings-row"><div><strong>Personal workspace</strong><p>Your prototype data is stored only in this browser's local storage, if available. It is not password protected, synchronized, or guaranteed private on shared devices.</p></div><span class="pill gold">Local demo</span></div></div><div class="card pad gap-section"><h2>Relationship tracking rules</h2><div class="grid g3" style="margin-top:15px"><div class="note-box"><strong>Basic tracking</strong><p style="margin-top:5px">Every explicitly approved LuMaCo contact.</p></div><div class="note-box"><strong>Detailed reporting</strong><p style="margin-top:5px">Automatically on for starred contacts; optional manual override for others.</p></div><div class="note-box"><strong>Unapproved senders</strong><p style="margin-top:5px">Categorized for Smart Email, never logged to relationship histories.</p></div></div><p class="muted small" style="margin-top:12px">Custom contact categories: ${state.categories.map(x=>esc(x)).join(' · ')}</p></div><div class="card pad gap-section"><h2>Demo data management</h2><p class="muted small" style="margin:7px 0 17px">Explore freely. You can export your current demo state, restore a JSON export, or reset fictional data.</p><div class="btn-row">${button(icon('download')+' Export demo JSON','export-demo','sm')}${button(icon('upload')+' Import demo JSON','import-demo','sm')}${button(icon('refresh')+' Reset fictional demo','reset-demo','sm danger')}</div><input type="file" id="import-file" accept="application/json,.json" style="display:none"></div><div class="card pad gap-section"><h2>Design system</h2><p class="muted small" style="margin:7px 0 12px">Approved: Navy & Champagne Gold · white dashboard · balanced density · original prototype-inspired review flows.</p><div style="display:flex;gap:8px">${['#172c47','#b58a3b','#ffffff','#f5f7fa','#e3e8ef'].map(x=>`<span title="${x}" style="width:58px;height:37px;border-radius:8px;background:${x};border:1px solid #ddd"></span>`).join('')}</div></div>`}
function openModal(kind,data=null){ui.modal=kind;ui.modalData=data;ui.meetingStage='choose';ui.meetingRecorded=false;ui.meetingConsent=false;renderModal()}

function wrapModal(title,subtitle,body,foot='',wide=false){return `<div class="modal-backdrop" data-dismiss="true"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${attr(title)}"><header class="modal-header"><div><div class="eyebrow">${esc(subtitle)}</div><h2>${esc(title)}</h2></div><button class="close" aria-label="Close dialog" data-action="close-modal">${icon('close','lg')}</button></header>${body}<footer class="modal-footer">${foot||button('Close','close-modal')}</footer></section></div>`}
function renderModal(){const dest=document.getElementById('overlay');if(!ui.modal){dest.innerHTML='';return}let h='',body='',foot='';let c,d,p,co;switch(ui.modal){
case 'scenarios':h='Demonstrate automation';body=`<div class="modal-body"><div class="demo-disclaimer">${icon('shield')} All workflows are fictional simulations. No apps, phone logs, microphone, calendar or inbox are connected.</div><div class="grid" style="gap:11px">${[['mail','Incoming customer email','Automatic categorization, contact match, Open Promise and email history.','simulate-email'],['message','Incoming customer text','Simulate a matched, permitted text and an automatically identified promise.','simulate-text'],['phone','Completed customer call','An immediate personal note pop-up for a detailed contact.','simulate-call'],['mic','Meeting ends','Choose a simulated meeting recording or after-meeting recap.','simulate-meeting'],['users','Suggested Contacts','Review a frequent business contact before tracking begins.','go-suggested']].map(([ico,t,sub,a])=>`<button class="card pad" style="width:100%;display:flex;align-items:center;gap:14px;text-align:left" data-action="${a}"><span class="row-icon">${icon(ico)}</span><span style="flex:1"><strong>${t}</strong><span class="small muted" style="display:block;margin-top:3px">${sub}</span></span>${icon('arrow')}</button>`).join('')}</div></div>`;break;

an>Contact categories (select multiple)</span><div class="choice-chips">${state.categories.map(x=>`<label><input type="checkbox" name="category" value="${attr(x)}" ${c?.categories?.includes(x)||(!c&&d.category===x)?'checked':''}> ${esc(x)}</label>`).join('')}</div></label><label class="field"><span>Add a custom category (available to everyone afterward)</span><input name="newCategory" maxlength="45" placeholder="e.g. Architect, Distributor, Consultant"></label><div class="grid g2" style="gap:6px"><label class="checkline"><input type="checkbox" name="starred" ${c?.starred?'checked':''}><span>Starred relationship<br><span class="small muted">Automatically enables detailed reports</span></span></label><label class="checkline"><input type="checkbox" name="detail" ${c?.detail?'checked':''}><span>Detailed reports independently<br><span class="small muted">For an unstarred contact, too</span></span></label></div><label class="field"><span>Private relationship notes</span><textarea name="notes" placeholder="Helpful context and preferences">${esc(c?.notes||'')}</textarea></label></form>`;foot=`${button('Cancel','close-modal') }<button class="btn primary" type="submit" form="contact-form">${c?'Save changes':'Approve & add contact'}</button>`;break;
case 'company':h='Add company';body=`<form id="company-form" class="modal-body"><label class="field"><span>Company name *</span><input name="name" required maxlength="100" placeholder="Organization name"></label><label class="field"><span>Company category</span><select name="type">${['Contractor','Engineer','Vendor','Owner','Internal','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field"><span>Notes</span><textarea name="notes" placeholder="Optional context"></textarea></label></form>`;foot=`${button('Cancel','close-modal')}<button type="submit" form="company-form" class="btn primary">Save company</button>`;break;

hould check equipment clearances before sending.</textarea></label><label class="field"><span>Summary for customer timeline</span><textarea name="summary">Reviewed Riverside drawing revisions and equipment clearances. Next step: send updated drawings by Friday.</textarea></label><div class="fields2"><label class="field"><span>Extracted Open Promise</span><input name="promise" value="Send updated Riverside drawings"></label><label class="field"><span>Due date</span><input name="due" type="date" value="${days(2)}"></label></div><div class="notice">Saving files the approved text to the personal contact history and creates the commitment. In production, temporary audio would be deleted after transcription unless the user explicitly opts to retain it.</div></form>`;foot=`${button('Back','meeting-record-back')}<button class="btn primary" type="submit" form="meeting-form">Approve & save text</button>`;}break;

function simulateEmail(){let count=++state.simulationCount;let c=contact('c1');let m={id:uid('m'),contactId:c.id,sender:c.name,email:c.email,companyId:c.companyId,subject:count===1?'Revised drawings and Friday commitment':`Riverside coordination update #${count}`,preview:'I will send the final marked-up drawings by Friday.',body:'Hi, thanks for checking in. I will send the final marked-up drawings by Friday. Please keep me posted if the review time changes.',category:'External',action:state.settings.autoPromises?'Open Promise':'FYI',priority:'High',date:today(),time:'Just now',tracked:true,projectId:'pr1',history:[{when:'Just now',text:'Sarah confirmed a commitment to send marked-up drawings by Friday.'}]};state.messages.unshift(m);state.interactions.unshift({id:uid('i'),contactId:c.id,type:'Email',date:today(),title:m.subject,summary:'Incoming message with a commitment about marked-up drawings.',source:'Email · simulated',projectId:'pr1'});if(state.settings.autoPromises){state.promises.unshift({id:uid('p'),title:'Send final marked-up drawings',owner:c.name,contactId:c.id,companyId:c.companyId,projectId:'pr1',due:days(2),status:'Open',source:'Email · '+m.subject,sourceId:m.id,origin:'I will send the final marked-up drawings by Friday.',direction:'Made to me',confidence:'High'})}ui.selectedMail=m.id;ui.mailCategory='All';ui.mailAction='All';ui.mailSearch='';nav('inbox');saveAndRender(state.settings.autoPromises?'Simulated email received → sorted → approved contact matched → Open Promise created automatically.':'Simulated email sorted and contact history updated. Automatic promises are disabled.');}

function handleAction(a){let c,p,m;
if(a==='close-modal'){closeModal();return}

if(a==='simulate-text'){closeModal();simulateText();return}

if(a==='simulate-meeting'){openModal('meeting',{contactId:'c1'});return}
if(a==='add-contact'){openModal('contact');return}

if(a==='add-company'){openModal('company');return}
if(a==='add-project'){openModal('project');return}
if(a==='add-promise'){openModal('promise');return}
if(a==='log-touchpoint'){openModal('note',{contactId:ui.selectedContact});return}

if(a==='note-current-contact'){openModal('note',{contactId:ui.selectedContact});return}
if(a==='view-mail-contact'){m=state.messages.find(x=>x.id===ui.selectedMail);if(m?.contactId)chooseContact(m.contactId);return}
if(a==='view-mail-promise'){p=state.promises.find(x=>x.sourceId===ui.selectedMail&&x.status==='Open');if(p)choosePromise(p.id);return}
if(a==='complete-mail-promise'){p=state.promises.find(x=>x.sourceId===ui.selectedMail&&x.status==='Open');if(p){p.status='Completed';saveAndRender('Promise marked completed in demo.')}return}
if(a==='original-message'){toast('No live account is linked. The original message would open in Outlook or Gmail after authorization.');return}
if(a==='mail-followup'){m=state.messages.find(x=>x.id===ui.selectedMail);if(m?.contactId)openModal('note',{contactId:m.contactId});return}
if(a==='go-followups'){nav('followups');return}
if(a==='go-promises'){ui.promiseFilter='Open';nav('promises');return}
if(a==='go-inbox'){nav('inbox');return}
if(a==='go-contacts'){nav('contacts');return}

if(a==='go-settings'){nav('settings');return}
if(a==='focus-off'){state.settings.focus=false;saveAndRender('LuMaCo Focus Mode off.');return}
if(a==='call-later'){c=contact(ui.modalData?.contactId)||contact('c1');state.drafts.unshift({id:uid('d'),status:'Pending',contactId:c.id,company:company(c.companyId)?.name||'',kind:'Call',created:today()});closeModal();saveAndRender('Call notes deferred. A reminder is now in Needs Attention.');return}
if(a==='meeting-live'||a==='meeting-recap'){ui.meetingKind=a==='meeting-live'?'live':'recap';ui.meetingStage='record';ui.meetingRecorded=false;renderModal();return}
if(a==='meeting-back'){ui.meetingStage='choose';renderModal();return}
if(a==='meeting-capture'){if(ui.meetingKind==='live'&&!ui.meetingConsent){toast('Check the participant-consent acknowledgement before simulating live meeting capture.');return}ui.meetingRecorded=true;renderModal();toast('Simulated capture complete. No audio was recorded.');return}
if(a==='meeting-review'){ui.meetingStage='review';renderModal();return}
if(a==='meeting-record-back'){ui.meetingStage='record';renderModal();return}
if(a==='confirm-reset'){state=seed();ui.page='dashboard';ui.modal=null;ui.selectedContact='c1';ui.selectedCompany='co1';ui.selectedProject='pr1';ui.selectedMail='m1';persist();render();toast('Fictional demo reset.');return}
if(a==='reset-demo'){openModal('reset');return}
if(a==='export-demo'){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const aa=document.createElement('a');aa.href=url;aa.download='lumaco-demo-export.json';document.body.appendChild(aa);aa.click();aa.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON demo export prepared.');return}
if(a==='import-demo'){document.getElementById('import-file')?.click();return}
if(a.startsWith('edit-promise-')){openModal('promise',{id:a.slice(13)});return}
if(a.startsWith('complete-promise-')||a.startsWith('dismiss-promise-')){let complete=a.startsWith('complete');p=state.promises.find(x=>x.id===a.slice(complete?17:16));if(p){p.status=complete?'Completed':'Dismissed';saveAndRender(`Promise ${complete?'completed':'dismissed'} in the demo.`)}return}
if(a.startsWith('approve-suggest-')){let s=state.suggestions.find(x=>x.id===a.slice(16));if(s){openModal('contact',{suggestion:s,suggestionId:s.id})}return}
if(a.startsWith('dismiss-suggest-')){state.suggestions=state.suggestions.filter(s=>s.id!==a.slice(16));saveAndRender('Suggestion dismissed; no contact created or tracked.');return}
if(a.startsWith('preview-integration-')){toast('Integration preview only. No account access is active; use Demonstrate automation to explore simulated behavior.');openModal('scenarios');return}
if(a.startsWith('log-')){openModal('note',{contactId:a.slice(4)});return}
if(a.startsWith('view-')){chooseContact(a.slice(5));return}

function handleSubmit(form){let fd=new FormData(form);const v=(n)=>(fd.get(n)||'').toString().trim();let c,co,p;if(form.id==='contact-form'){let old=ui.modalData?.id?contact(ui.modalData.id):null;let name=v('name');if(!name){toast('Contact name is required.');return}let coId=v('companyId');let typed=v('newCompany');if(typed){let existing=state.companies.find(x=>x.name.toLowerCase()===typed.toLowerCase());if(existing)coId=existing.id;else{let newCo={id:uid('co'),name:typed,type:'Other',notes:''};state.companies.push(newCo);coId=newCo.id}}let cats=fd.getAll('category').map(String);let newCat=v('newCategory');if(newCat&&!state.categories.some(x=>x.toLowerCase()===newCat.toLowerCase()))state.categories.push(newCat);if(newCat&&!cats.some(x=>x.toLowerCase()===newCat.toLowerCase()))cats.push(newCat);let obj={name,title:v('title'),email:v('email'),phone:v('phone'),companyId:coId||null,categories:cats,priority:v('priority')||'Medium',starred:fd.has('starred'),detail:fd.has('detail'),cadence:+v('cadence')||90,notes:v('notes')};if(old){Object.assign(old,obj);c=old}else{c={id:uid('c'),last:today(),...obj};state.contacts.push(c)}if(ui.modalData?.suggestionId)state.suggestions=state.suggestions.filter(x=>x.id!==ui.modalData.suggestionId);ui.selectedContact=c.id;ui.contactsFilter='All';ui.contactSearch='';closeModal();nav('contacts');saveAndRender(old?'Contact updated.':'Contact approved and added — basic tracking is now enabled.');return}
if(form.id==='company-form'){let name=v('name');if(!name)return;let existing=state.companies.find(x=>x.name.toLowerCase()===name.toLowerCase());if(existing){toast('This company already exists.');return}co={id:uid('co'),name,type:v('type'),notes:v('notes')};state.companies.push(co);ui.selectedCompany=co.id;closeModal();nav('companies');saveAndRender('Company added.');return}
if(form.id==='project-form'){let name=v('name');if(!name)return;p={id:uid('pr'),name,companyId:v('companyId'),status:v('status'),progress:Math.max(0,Math.min(100,+v('progress')||0)),description:v('description'),contactIds:fd.getAll('contactIds').map(String)};state.projects.push(p);ui.selectedProject=p.id;closeModal();nav('projects');saveAndRender('Project added to the demo.');return}
if(form.id==='promise-form'){let old=ui.modalData?.id?state.promises.find(x=>x.id===ui.modalData.id):null;let c=contact(v('contactId'));let obj={title:v('title'),owner:v('owner'),contactId:c?.id||null,companyId:c?.companyId||old?.companyId||null,due:v('due'),source:v('source'),origin:v('origin'),direction:v('direction')};if(!obj.title||!obj.due){toast('A promise title and due date are required.');return}if(old){Object.assign(old,obj)}else{state.promises.unshift({id:uid('p'),status:'Open',sourceId:null,confidence:'User-created',...obj})}ui.promiseFilter='Open';closeModal();nav('promises');saveAndRender(old?'Promise updated.':'Open Promise created.');return}
if(form.id==='call-form'){c=contact(ui.modalData?.contactId)||contact('c1');let text=v('summary');if(!text){toast('Please enter what was discussed.');return}state.interactions.unshift({id:uid('i'),contactId:c.id,type:'Call',date:today(),title:'Customer call · reviewed touchpoint',summary:text+(v('next')?' Next step: '+v('next'):''),source:'Simulated call metadata · user-approved notes',projectId:null});c.last=today();if(v('promise'))state.promises.unshift({id:uid('p'),title:v('promise'),owner:'You',contactId:c.id,companyId:c.companyId,projectId:null,due:v('due')||days(3),status:'Open',source:'Reviewed after-call notes',sourceId:null,origin:text,direction:'Made by me',confidence:'User-reviewed'});state.drafts=state.drafts.filter(x=>x.contactId!==c.id||x.kind!=='Call');ui.selectedContact=c.id;closeModal();nav('contacts');saveAndRender('Call context approved and saved to the contact timeline.');return}
if(form.id==='meeting-form'){c=contact(ui.modalData?.contactId)||contact('c1');let text=v('summary')||v('transcript');if(!text){toast('Enter a summary or transcript to file.');return}state.interactions.unshift({id:uid('i'),contactId:c.id,type:'Meeting',date:today(),title:'Meeting notes · reviewed transcription',summary:text,transcript:v('transcript'),source:'Simulated text transcription · reviewed by user',projectId:'pr1'});c.last=today();if(v('promise'))state.promises.unshift({id:uid('p'),title:v('promise'),owner:'You',contactId:c.id,companyId:c.companyId,projectId:'pr1',due:v('due')||days(2),status:'Open',source:'Reviewed meeting transcript',sourceId:null,origin:v('transcript'),direction:'Made by me',confidence:'User-reviewed'});ui.selectedContact=c.id;closeModal();nav('contacts');saveAndRender('Approved transcript saved as text; no audio was created or stored.');return}
