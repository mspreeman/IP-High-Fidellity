name: Local prototype checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend rule and schema tests
        run: python -m unittest discover -s tests -v
      - name: Frontend script syntax
        run: for file in frontend/scripts/*.js; do node --check "$file"; done
      - name: Frontend render smoke test
        run: node tests/frontend-smoke.cjs
